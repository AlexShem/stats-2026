project:
  type: book
  output-dir: _output/book
  render:
    - index.qmd
    - "seminars/**/*.qmd"

# Книга для студентов (HTML): теория, задачи, решения и примеры на Python.
# Профиль `handout` (см. _quarto-handout.yml) даёт PDF-раздатку с одними
# условиями задач — всё, что обёрнуто в
# ::: {.content-hidden when-profile="handout"}, в раздатку не попадает.

book:
  title: "Теория вероятностей и математическая статистика"
  subtitle: "Семинары · НИЯУ МИФИ · осенний семестр 2026"
  author: "А. Шемендюк"
  language: ru
  chapters:
    - index.qmd
    - seminars/01-addition-multiplication/seminar-01.qmd
    - seminars/02-discrete-random-variables/seminar-02.qmd
    - seminars/03-continuous-random-variables/seminar-03.qmd

lang: ru
date-format: "D MMMM YYYY"

execute:
  freeze: auto
  echo: true
  warning: false

format:
  html:
    theme: [cosmo, book.scss]
    toc: true
    toc-depth: 3
    toc-title: "Содержание"
    number-sections: true
    number-depth: 3
    code-fold: false
    code-tools: false
    grid:
      body-width: 960px
      sidebar-width: 270px
      margin-width: 270px
    fig-width: 7
    fig-height: 4.5
    # Математические макросы для MathJax — зеркало include-in-header
    # из _quarto-handout.yml. Добавляя макрос, правьте оба файла.
    include-in-header:
      text: |
        <script>
        window.MathJax = {
          tex: {
            macros: {
              E: "\\mathbb{E}",
              Var: "\\mathrm{D}",
              Prob: "\\mathbb{P}",
              Cov: "\\mathrm{cov}",
              indep: "\\perp\\!\\!\\!\\perp"
            }
          }
        };
        </script>

bibliography: references.bib
