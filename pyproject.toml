[project]
name = "stats-2026"
version = "0.1.0"
description = "Материалы к семинарам по теории вероятностей и математической статистике (НИЯУ МИФИ, осень 2026)"
readme = "README.md"
authors = [
    { name = "AlexShem", email = "alex.shemendyuk@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "sympy>=1.13",
    "statsmodels>=0.14",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "great-tables>=0.14",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mephi_stats"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
